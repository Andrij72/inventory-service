version: '3.9'

services:
  postgres-inventory:
    image: postgres:15
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5433"
    networks:
      - microservices-net

  inventory-service:
    image: inventory-service:latest
    container_name: inventory-service
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5433/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_CLIENT_USER}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_CLIENT_PASSWORD}
    depends_on:
      postgres-inventory:
        condition: service_healthy
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres-data: