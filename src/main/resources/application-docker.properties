# ====================================
#    APPLICATION CONFIG
# ====================================
spring.application.name=inventory-service
server.port=8082

# ====================================
#    DATABASE CONFIG
# ====================================
spring.datasource.url=jdbc:mysql://mysql:3306/inventory_service?useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.flyway.locations=classpath:db/migration

# ====================================
#    MAIL (Mailtrap)
# ====================================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=ce8b85c52e2eda
spring.mail.password=0efa2d52ac28f1

# ====================================
#    KAFKA CONSUMER CONFIG
# ====================================
spring.kafka.bootstrap-servers=broker:29092
spring.kafka.consumer.group-id=NotificationService
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.consumer.properties.specific.avro.reader=true

# ====================================
#    LOGGING CONFIGURATION
# ====================================
logging.level.root=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

#logging.pattern.console={"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%level","thread":"%thread","logger":"%logger","service":"${spring.application.name}","message":"%msg"}%n

# ====================================
#    ACTUATOR / PROMETHEUS / TRACING
# ====================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ====================================
#    EUREKA DISCOVERY
# ====================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
