name: Build & Test Inventory Service

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/inventory-service
  SPRING_PROFILES_ACTIVE: test

permissions:
  contents: read
  packages: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: inventory_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # --- Checkout code
      - uses: actions/checkout@v3

      # --- Setup JDK 21 + Maven cache
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # --- Setup Maven settings with GitHub Packages credentials
      - name: Setup Maven settings
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOL
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.MAVEN_USERNAME }}</username>
                <password>${{ secrets.MAVEN_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOL

      # --- Build Inventory Service + run tests
      - name: Build Inventory Service + run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventory_service
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
        run: mvn clean verify -B

      # --- Docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # --- Build & Push Docker image
      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:dev-latest .
          docker tag ${{ env.DOCKER_IMAGE }}:dev-latest ${{ env.DOCKER_IMAGE }}:dev-${{ env.SHORT_SHA }}
          docker push ${{ env.DOCKER_IMAGE }}:dev-latest
          docker push ${{ env.DOCKER_IMAGE }}:dev-${{ env.SHORT_SHA }}

      # --- Run Inventory Service container for API tests
      - name: Run Inventory Service container
        run: |
          docker run -d --name inventory-service \
            -p 8082:8082 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/inventory_service \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect \
            ${{ env.DOCKER_IMAGE }}:dev-latest

      # --- Wait for service to be ready
      - name: Wait for service to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8082/actuator/health | grep UP && break
            echo "Waiting for service..."
            sleep 5
          done

      # --- Run basic API test
      - name: Run API tests
        run: |
          curl -f "http://localhost:8082/api/v1/inventory?sku=iphone_15&quantity=3"
